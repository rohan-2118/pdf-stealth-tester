name: Continuous 24/7 Sequential Full-Browser Matrix

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [rerun_matrix]

jobs:
  group-one:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2, 3, 4, 5]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Prepare System & Playwright Environment
      run: |
        sudo apt-get update && sudo apt-get install -y xvfb libgbm-dev
        python -m pip install --upgrade pip
        pip install playwright playwright-stealth numpy requests
        playwright install chromium && playwright install-deps chromium
    - name: Execute Group 1
      run: xvfb-run --server-args="-screen 0 1920x1080x24" python bot_script.py

  group-two:
    needs: group-one
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2, 3, 4, 5]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Prepare System & Playwright Environment
      run: |
        sudo apt-get update && sudo apt-get install -y xvfb libgbm-dev
        python -m pip install --upgrade pip
        pip install playwright playwright-stealth numpy requests
        playwright install chromium && playwright install-deps chromium
    - name: Execute Group 2
      run: xvfb-run --server-args="-screen 0 1920x1080x24" python bot_script.py

  group-three:
    needs: group-two
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2, 3, 4, 5]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Prepare System & Playwright Environment
      run: |
        sudo apt-get update && sudo apt-get install -y xvfb libgbm-dev
        python -m pip install --upgrade pip
        pip install playwright playwright-stealth numpy requests
        playwright install chromium && playwright install-deps chromium
    - name: Execute Group 3
      run: xvfb-run --server-args="-screen 0 1920x1080x24" python bot_script.py

  infinite-loop-trigger:
    needs: group-three
    runs-on: ubuntu-latest
    steps:
    - name: Loop back and immediately start Group 1 again
      run: |
        curl -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://github.com{{ github.repository }}/dispatches \
          -d '{"event_type": "rerun_matrix"}'
